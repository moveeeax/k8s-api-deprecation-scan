name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 ./...

  selfcheck:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: build cli
        run: go build -o k8s-api-deprecation-scan ./cmd/k8s-api-deprecation-scan

      - name: examples are clean for an old cluster
        run: ./k8s-api-deprecation-scan --target-version 1.21 examples/manifests

      - name: examples fail for a modern cluster
        run: |
          set +e
          ./k8s-api-deprecation-scan --target-version 1.29 examples/manifests
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 on removed APIs, got $code"
            exit 1
          fi

      - name: json output is valid
        run: ./k8s-api-deprecation-scan --format json --target-version 1.29 examples/manifests | jq -e '.summary.removed == 4'
