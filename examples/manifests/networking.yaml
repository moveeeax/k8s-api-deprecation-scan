apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: checkout
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: checkout.example.com
      http:
        paths:
          - path: /
            backend:
              serviceName: checkout
              servicePort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
spec:
  selector:
    app: checkout
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: reconcile-orders
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reconcile
              image: ghcr.io/example/reconcile:1.0.0
